<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic AI Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="apps.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- IMMERSIVE AI NEURAL NETWORK BACKGROUND -->
    <canvas id="bg-canvas"
        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>

    <!-- STANDARD NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="pulse-dot"></span>
            Purpose Matrix™
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#directory">Solutions Directory</a></li>
        </ul>
    </nav>

    <!-- MAIN SCROLLING WEBPAGE CONTENT -->
    <div class="page-wrapper">

        <!-- FULL SCREEN IMMERSIVE HERO SECTION -->
        <section id="home" class="scroll-section full-screen">
            <div class="hero-content">
                <h1 class="hero-title">Replace Every App With<br>A Single Purpose.</h1>

                <div class="magic-input-wrapper"
                    style="margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1rem; max-width: 600px;">
                    <input type="text" id="magic-input" class="magic-input">
                    <button class="primary-btn" id="magic-btn" style="width: max-content;">Generate Workspace ✨</button>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <a href="#directory" class="primary-btn">Explore Directory ➔</a>
                </div>
            </div>

            <!-- Dynamic Custom Project Logo (Abstract AI / Intent Core) -->
            <div class="hero-logo-box">
                <svg viewBox="0 0 100 100" class="intent-logo-svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#3b82f6" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Ambient Outer Ring -->
                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
                    <!-- Rotating Dashed Tech Intelligence Ring -->
                    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad1)" stroke-width="2"
                        stroke-dasharray="8 6" class="rotating-ring" />
                    <!-- Inner Solid Processing Core -->
                    <circle cx="50" cy="50" r="22" fill="url(#grad1)" filter="url(#glow)" />
                    <!-- Inner Neural Pulse Beat -->
                    <circle cx="50" cy="50" r="12" fill="#ffffff" filter="url(#glow)">
                        <animate attributeName="r" values="8; 15; 8" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <!-- App Node Satellites (Representing distinct distinct domain apps converging) -->
                    <circle cx="10" cy="50" r="4" fill="#10b981" filter="url(#glow)" class="satellite-1" />
                    <circle cx="90" cy="50" r="3" fill="#ef4444" filter="url(#glow)" class="satellite-2" />
                    <circle cx="50" cy="10" r="5" fill="#f59e0b" filter="url(#glow)" class="satellite-3" />
                </svg>
            </div>
        </section>



        <!-- 20 CATEGORIES DOMAIN HUB -->
        <section id="directory" class="scroll-section">
            <h2 class="section-heading">Solutions Directory</h2>
            <p style="text-align:center; color:#94a3b8; margin-top:-1.5rem; margin-bottom: 3rem; font-size:1.1rem;">
                Click any industry domain below to render its functional micro-app UI in real-time.
            </p>

            <div class="grid-container" id="category-grid">
                <!-- Javascript maps the 20 stylized Icon Cards here dynamically -->
            </div>
        </section>

        <!-- STANDARD FOOTER -->
        <footer class="alt-bg">
            <div class="footer-content">
                <div class="nav-brand" style="margin-bottom: 1rem; justify-content: center;">
                    <span class="pulse-dot"></span>
                    Purpose Matrix™
                </div>

            </div>
        </footer>

    </div>

    <!-- POPUP MODAL FOR DYNAMIC APPS -->
    <div id="loading-modal" class="modal">
        <div class="modal-content glass-app" style="text-align: center; max-width: 400px;">
            <div class="spinner"></div>
            <h2 style="margin-top: 1.5rem;">Building your workspace...</h2>
        </div>
    </div>

    <div id="app-modal" class="modal">
        <div class="modal-content glass-app">
            <button class="close-modal" onclick="closeAppModal()" id="back-home-btn">✕</button>
            <div id="dynamic-canvas"></div>
            <button class="secondary-btn" onclick="closeAppModal()" style="margin-top:2rem; width:100%;">🔙 Back to Home
                Screen</button>
        </div>
    </div>

    <script src="apps.js"></script>
    <script src="script.js"></script>
</body>

</html>
